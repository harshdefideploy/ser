# Prefer setting Build/Start in Railway Dashboard (Config-as-code is deprecated for new services).
# If your service still supports config file path, set it to: /railway.api.toml

[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile && pnpm run build:api"

[deploy]
startCommand = "pnpm run start:release"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
