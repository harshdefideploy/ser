packages:
  - "apps/*"
  - "packages/*"

# pnpm 10.28+ reads build approvals here (not package.json#pnpm).
# allowBuilds is preferred; onlyBuiltDependencies kept for older 10.x.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild

autoInstallPeers: true
strictPeerDependencies: false
nodeLinker: hoisted
